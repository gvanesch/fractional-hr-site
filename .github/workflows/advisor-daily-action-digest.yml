name: Advisor Daily Action Digest

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Force send outside 08:00 Europe/London"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 7 * * *"
    - cron: "0 8 * * *"

permissions:
  contents: read

jobs:
  send-advisor-action-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Verify required secret is present
        env:
          DAILY_SUMMARY_ENDPOINT_SECRET: ${{ secrets.DAILY_SUMMARY_ENDPOINT_SECRET }}
        run: |
          test -n "$DAILY_SUMMARY_ENDPOINT_SECRET"
          echo "Required advisor digest secret is present."

      - name: Trigger advisor action digest endpoint
        env:
          DAILY_SUMMARY_ENDPOINT_SECRET: ${{ secrets.DAILY_SUMMARY_ENDPOINT_SECRET }}
          FORCE_SEND: ${{ inputs.force }}
        run: |
          ADVISOR_ACTION_DIGEST_URL="https://www.vanesch.uk/api/advisor-daily-action-digest"

          if [ "$FORCE_SEND" = "true" ]; then
            ADVISOR_ACTION_DIGEST_URL="${ADVISOR_ACTION_DIGEST_URL}?force=true"
          fi

          curl --fail-with-body --show-error --location --write-out "\nHTTP_STATUS:%{http_code}\n" \
            --request POST \
            --url "${ADVISOR_ACTION_DIGEST_URL}" \
            --header "Authorization: Bearer ${DAILY_SUMMARY_ENDPOINT_SECRET}"
