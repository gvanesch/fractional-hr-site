name: Advisor Daily Action Digest

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"
    - cron: "0 8 * * *"

permissions:
  contents: read

jobs:
  send-advisor-action-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Verify required secrets are present
        env:
          ADVISOR_ACTION_DIGEST_URL: ${{ secrets.ADVISOR_ACTION_DIGEST_URL }}
          DAILY_SUMMARY_ENDPOINT_SECRET: ${{ secrets.DAILY_SUMMARY_ENDPOINT_SECRET }}
        run: |
          test -n "$ADVISOR_ACTION_DIGEST_URL"
          test -n "$DAILY_SUMMARY_ENDPOINT_SECRET"
          echo "Required advisor digest secrets are present."

      - name: Trigger advisor action digest endpoint
        env:
          ADVISOR_ACTION_DIGEST_URL: ${{ secrets.ADVISOR_ACTION_DIGEST_URL }}
          DAILY_SUMMARY_ENDPOINT_SECRET: ${{ secrets.DAILY_SUMMARY_ENDPOINT_SECRET }}
        run: |
          curl --fail-with-body --show-error --location --write-out "\nHTTP_STATUS:%{http_code}\n" \
            --request POST \
            --url "${ADVISOR_ACTION_DIGEST_URL}" \
            --header "x-cron-secret: ${DAILY_SUMMARY_ENDPOINT_SECRET}"