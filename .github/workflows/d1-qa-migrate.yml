name: D1 QA migrations

on:
  workflow_dispatch:
  push:
    branches:
      - migration/d1
    paths:
      - migrations/**
      - scripts/d1/**
      - .github/workflows/d1-qa-migrate.yml

permissions:
  contents: read

concurrency:
  group: d1-qa-migrations
  cancel-in-progress: false

jobs:
  migrate-and-verify:
    name: Apply and verify QA migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CI: "true"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "73221f18acc676e4992c89fcbf2b2a8f"
      NEXT_PUBLIC_APP_ENV: local
      NEXT_PUBLIC_SUPABASE_URL: https://lrlapaiyejvbckqpbrwa.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-key
      NEXT_PUBLIC_SITE_URL: http://localhost:8787
      ADVISOR_ALLOWED_EMAILS: advisor@example.com
      RESEND_API_KEY: re_ci_placeholder
      CONTACT_FROM_EMAIL: advisor@example.com
      CONTACT_TO_EMAIL: advisor@example.com
      CRON_SECRET: ci-placeholder-cron-secret
      DAILY_SUMMARY_RECIPIENT: advisor@example.com
      CLIENT_DIAGNOSTIC_OTP_SECRET: ci-placeholder-otp-secret
      INVITE_RATE_LIMIT_SALT: ci-placeholder-rate-limit-salt

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Normalize Cloudflare token
        shell: bash
        run: |
          set -euo pipefail

          token="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n')"
          token="${token#Bearer }"
          token="${token#bearer }"
          token="$(printf '%s' "$token" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"

          if [[ -z "$token" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN is empty."
            exit 1
          fi

          if [[ ! "$token" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not a raw Cloudflare API token."
            exit 1
          fi

          echo "::add-mask::$token"
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"

      - name: Verify QA target
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const config = JSON.parse(fs.readFileSync("wrangler.jsonc", "utf8"));
          const qa = config.env?.qa?.d1_databases?.find((database) => database.binding === "DB");
          const production = config.d1_databases?.find((database) => database.binding === "DB");

          if (!qa || qa.database_name !== "vanesch-qa") {
            throw new Error("QA D1 binding is missing or does not target vanesch-qa.");
          }

          if (qa.database_id !== "b25d59da-5f93-4301-9996-7be0c9708789") {
            throw new Error("QA D1 database ID does not match the approved QA database.");
          }

          if (qa.database_id === production?.database_id) {
            throw new Error("QA and production resolve to the same D1 database.");
          }

          console.log(`Verified QA target: ${qa.database_name} (${qa.database_id})`);
          NODE

      - name: Apply migrations and run smoke tests
        shell: bash
        run: |
          set -euo pipefail
          : > d1-qa-migration.log

          {
            echo "=== Pending migrations before apply ==="
            npx wrangler d1 migrations list DB --env qa --remote

            echo "=== Applying QA migrations ==="
            npx wrangler d1 migrations apply DB --env qa --remote

            echo "=== Core client diagnostic smoke test ==="
            npx wrangler d1 execute DB --env qa --remote --file scripts/d1/client-diagnostic-core-smoke-test.sql

            echo "=== Security-state smoke test ==="
            npx wrangler d1 execute DB --env qa --remote --file scripts/d1/client-diagnostic-security-smoke-test.sql

            echo "=== Security-service behaviour smoke test ==="
            npx wrangler d1 execute DB --env qa --remote --file scripts/d1/client-diagnostic-security-service-smoke-test.sql

            echo "=== Fail-closed QA assertions ==="
            npx wrangler d1 execute DB --env qa --remote --command "
              SELECT
                CASE WHEN (
                  SELECT count(*)
                  FROM d1_migrations
                  WHERE name IN (
                    '0004_create_client_diagnostic_core.sql',
                    '0005_create_client_diagnostic_security.sql'
                  )
                ) = 2
                THEN 'passed'
                ELSE json_extract('migration assertion failed', '$')
                END AS migrations_0004_0005;

              SELECT
                CASE WHEN (
                  (SELECT count(*) FROM client_projects
                    WHERE project_id LIKE 'd1-core-probe-%'
                       OR project_id LIKE 'd1-security-probe-%')
                  + (SELECT count(*) FROM client_participants
                    WHERE participant_id LIKE 'd1-core-probe-%'
                       OR participant_id LIKE 'd1-security-probe-%')
                  + (SELECT count(*) FROM client_responses
                    WHERE response_id LIKE 'd1-core-probe-%')
                  + (SELECT count(*) FROM client_dimension_scores
                    WHERE score_id LIKE 'd1-core-probe-%')
                  + (SELECT count(*) FROM client_fact_packs
                    WHERE fact_pack_id LIKE 'd1-core-probe-%')
                  + (SELECT count(*) FROM client_functional_signal_requests
                    WHERE signal_request_id LIKE 'd1-core-probe-%')
                  + (SELECT count(*) FROM client_service_access_context
                    WHERE context_id LIKE 'd1-core-probe-%')
                  + (SELECT count(*) FROM client_diagnostic_invite_rate_limits
                    WHERE ip_hash LIKE 'd1-security-probe-%')
                  + (SELECT count(*) FROM client_participant_otp_challenges
                    WHERE challenge_id LIKE 'd1-security-probe-%')
                  + (SELECT count(*) FROM client_participant_verified_sessions
                    WHERE session_id LIKE 'd1-security-probe-%')
                ) = 0
                THEN 'passed'
                ELSE json_extract('probe cleanup assertion failed', '$')
                END AS probe_cleanup;

              SELECT
                CASE WHEN (SELECT count(*) FROM pragma_foreign_key_check) = 0
                THEN 'passed'
                ELSE json_extract('foreign key assertion failed', '$')
                END AS foreign_key_check;

              SELECT
                CASE WHEN (
                  SELECT quick_check
                  FROM pragma_quick_check
                  LIMIT 1
                ) = 'ok'
                THEN 'passed'
                ELSE json_extract('integrity assertion failed', '$')
                END AS quick_check;
            "

            echo "=== Applied migrations after verification ==="
            npx wrangler d1 migrations list DB --env qa --remote
          } 2>&1 | tee -a d1-qa-migration.log

      - name: Verify application security service against local D1
        shell: bash
        run: |
          set -euo pipefail

          npx wrangler d1 migrations apply DB --local
          npm run preview > d1-security-runtime.log 2>&1 &
          preview_pid=$!

          cleanup() {
            kill "$preview_pid" 2>/dev/null || true
            wait "$preview_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8787/ > /dev/null; then
              break
            fi

            if ! kill -0 "$preview_pid" 2>/dev/null; then
              cat d1-security-runtime.log
              exit 1
            fi

            if [[ "$attempt" -eq 90 ]]; then
              cat d1-security-runtime.log
              echo "::error::Local Worker preview did not become ready."
              exit 1
            fi

            sleep 1
          done

          response="$(
            curl --fail-with-body --silent --show-error \
              --request POST \
              http://127.0.0.1:8787/api/d1-security-service-probe
          )"
          printf '%s\n' "$response"

          PROBE_RESPONSE="$response" node <<'NODE'
          const response = JSON.parse(process.env.PROBE_RESPONSE);
          const expected = [
            "inviteRateLimit",
            "otpIssuance",
            "resendControls",
            "attemptLimit",
            "sessionCreation",
            "singleUseChallenge",
            "invitationRevalidation",
            "cleanup",
          ];

          if (response.status !== "ok") {
            throw new Error("D1 security service probe did not return ok.");
          }

          for (const key of expected) {
            if (response.d1?.[key] !== "passed") {
              throw new Error(`D1 security service assertion failed: ${key}`);
            }
          }
          NODE

          mutation_response="$(
            curl --fail-with-body --silent --show-error \
              --request POST \
              http://127.0.0.1:8787/api/d1-client-mutation-probe
          )"
          printf '%s\n' "$mutation_response"

          PROBE_RESPONSE="$mutation_response" node <<'NODE'
          const response = JSON.parse(process.env.PROBE_RESPONSE);
          const expected = [
            "diagnosticSubmission",
            "duplicateSubmission",
            "transactionRollback",
            "factPackDraft",
            "factPackSubmission",
            "duplicateFactPack",
            "publicDiagnosticRead",
            "publicDiagnosticEmailUpdate",
            "participantInviteRead",
            "factPackRead",
            "cascadeCleanup",
          ];

          if (response.status !== "ok") {
            throw new Error("D1 client mutation probe did not return ok.");
          }

          for (const key of expected) {
            if (response.d1?.[key] !== "passed") {
              throw new Error(`D1 client mutation assertion failed: ${key}`);
            }
          }
          NODE

      - name: Retain migration log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d1-qa-migration-log-${{ github.run_id }}
          path: |
            d1-qa-migration.log
            d1-security-runtime.log
          if-no-files-found: warn
          retention-days: 14
