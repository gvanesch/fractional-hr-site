name: D1 QA email transport smoke

on:
  push:
    branches:
      - migration/d1
    paths:
      - scripts/d1/qa-email-transport-smoke.mjs

permissions:
  contents: read
  statuses: write

jobs:
  send-test:
    name: Send one QA-only contact email to Greg
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: email_probe
        run: node scripts/d1/qa-email-transport-smoke.mjs
      - name: Publish sanitized result and run link
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PROBE_OUTCOME: ${{ steps.email_probe.outcome }}
        run: |
          node --input-type=module <<'NODE'
          const { GITHUB_REPOSITORY: repo, GITHUB_SHA: sha, GITHUB_RUN_ID: run, GH_TOKEN: token } = process.env;
          const state = process.env.PROBE_OUTCOME === "success" ? "success" : "failure";
          const response = await fetch(`https://api.github.com/repos/${repo}/statuses/${sha}`, {
            method: "POST",
            headers: {
              Authorization: `Bearer ${token}`,
              Accept: "application/vnd.github+json",
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              state,
              context: "D1 QA email transport smoke",
              description: state === "success" ? "QA contact and Resend handoff accepted" : "Inspect the QA email probe job",
              target_url: `https://github.com/${repo}/actions/runs/${run}`,
            }),
          });
          if (!response.ok) throw new Error(`GitHub status publication failed: HTTP ${response.status}`);
          NODE
