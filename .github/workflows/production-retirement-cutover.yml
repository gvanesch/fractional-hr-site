name: Reviewed production D1 and Access cutover

on:
  push:
    branches:
      - chore/supabase-retirement-2026-11
    paths:
      - scripts/security/production-retirement-release-request.json

permissions:
  contents: read

concurrency:
  group: vanesch-production-release
  cancel-in-progress: false

jobs:
  cutover:
    if: github.repository == 'gvanesch/fractional-hr-site' && github.ref == 'refs/heads/chore/supabase-retirement-2026-11'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
      NEXT_PUBLIC_APP_ENV: production
      NEXT_PUBLIC_SITE_URL: https://www.vanesch.uk
      ADVISOR_AUTH_MODE: cloudflare_access
      D1_SYSTEM_EVENTS_MODE: d1
      D1_DIAGNOSTIC_SUBMISSIONS_MODE: d1
      D1_CRM_PROSPECTS_MODE: d1
      D1_CLIENT_DIAGNOSTIC_MODE: d1
      D1_CLIENT_DIAGNOSTIC_SECURITY_MODE: d1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify application and release guards without provider credentials
        run: npm run test:d1
      - name: Validate the exact request and existing runtime with GET only
        env:
          CLOUDFLARE_ACCOUNT_ID: '73221f18acc676e4992c89fcbf2b2a8f'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/security/production-retirement-cutover.mjs preflight
      - name: Build production code before changing any live Access settings
        run: npx opennextjs-cloudflare build --config wrangler.jsonc
      - name: Pin the complete built Worker without provider credentials
        run: node scripts/security/production-retirement-cutover.mjs capture-build
      - name: Apply the exact Access plan and activate the verified production Worker once
        env:
          CLOUDFLARE_ACCOUNT_ID: '73221f18acc676e4992c89fcbf2b2a8f'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_RETIREMENT_AUDIT_TOKEN: ${{ secrets.CLOUDFLARE_RETIREMENT_AUDIT_TOKEN }}
        run: node scripts/security/production-retirement-cutover.mjs apply
      - name: Retain sanitized progress and recovery identifiers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-retirement-cutover-evidence
          path: production-retirement-cutover-report.json
          if-no-files-found: ignore
          retention-days: 14
