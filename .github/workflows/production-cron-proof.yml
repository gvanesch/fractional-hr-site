name: Production cron no-send proof

on:
  push:
    branches:
      - chore/supabase-retirement-2026-11
    paths:
      - scripts/security/production-cron-proof-request.json

permissions:
  contents: read

concurrency:
  group: vanesch-production-release
  cancel-in-progress: false

jobs:
  prove:
    if: github.repository == 'gvanesch/fractional-hr-site' && github.ref == 'refs/heads/chore/supabase-retirement-2026-11' && github.event_name == 'push' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: '73221f18acc676e4992c89fcbf2b2a8f'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify dry-run proof guards without credentials
        run: node --test tests/d1/production-cron-proof.test.mjs
      - name: Validate the fresh request-only commit before provider access
        run: node scripts/security/production-cron-proof.mjs validate
      - name: Verify the live version and both existing no-send handlers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DAILY_SUMMARY_ENDPOINT_SECRET: ${{ secrets.DAILY_SUMMARY_ENDPOINT_SECRET }}
        run: node scripts/security/production-cron-proof.mjs prove
      - name: Retain sanitized count-only proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-cron-proof-evidence
          path: production-cron-proof-report.json
          if-no-files-found: ignore
          retention-days: 14
