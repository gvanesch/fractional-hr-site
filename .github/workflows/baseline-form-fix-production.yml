name: Production baseline checkbox fix
on:
  push:
    branches: [migration/d1]
    paths: [scripts/baseline/form-fix-release-approval.json]
permissions:
  contents: read
  actions: read
concurrency:
  group: vanesch-production-release
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: '73221f18acc676e4992c89fcbf2b2a8f'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      NEXT_PUBLIC_APP_ENV: production
      NEXT_PUBLIC_SUPABASE_URL: https://qxddddhhpfrrxbaunwfw.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SITE_URL: https://vanesch.uk
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npm run test:d1
      - run: npx tsc --noEmit
      - name: Validate exact QA evidence and preserve production settings
        run: node scripts/baseline/form-fix-release.mjs prepare
      - name: Build the production export update
        run: npx opennextjs-cloudflare build
      - name: Deploy form fix with existing Greg-only mail restrictions
        run: npx opennextjs-cloudflare deploy
      - name: Verify production bindings and protected download
        run: node scripts/baseline/form-fix-release.mjs verify
      - name: Retain synthetic workbook and recovery identifiers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-form-fix-production-verification
          path: |
            baseline-form-fix-recovery.json
          if-no-files-found: ignore
          retention-days: 30
