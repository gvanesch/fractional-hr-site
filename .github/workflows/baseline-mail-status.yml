name: Read-only production baseline email test status
on:
  push:
    branches: [migration/d1]
    paths: [scripts/baseline/production-mail-status-request.json]
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CLOUDFLARE_ACCOUNT_ID: '73221f18acc676e4992c89fcbf2b2a8f'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Inspect only the pinned production test status
        run: node scripts/baseline/production-mail-status.mjs
