name: D1 explicitly approved production data activation

on:
  push:
    branches: [migration/d1]
    paths:
      - scripts/d1/production-activation-approval.json

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: vanesch-production-release
  cancel-in-progress: false

jobs:
  activate:
    name: Activate D1 only after exact separate production approval
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: '73221f18acc676e4992c89fcbf2b2a8f'
      ACTIVATION_PREVIOUS_SHA: ${{ github.event.before }}
      NEXT_PUBLIC_APP_ENV: production
      NEXT_PUBLIC_SUPABASE_URL: https://qxddddhhpfrrxbaunwfw.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SITE_URL: https://vanesch.uk
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:d1
      - name: Validate approval, fresh snapshots, reviewed artifact and live settings
        id: prepare
        run: node scripts/d1/prepare-approved-production-activation.mjs
      - name: Download only the reviewed production bundle
        uses: actions/download-artifact@v4
        with:
          name: approved-d1-production-bundle
          path: .open-next
          run-id: ${{ steps.prepare.outputs.bundle_run_id }}
          github-token: ${{ github.token }}
      - name: Recheck data, freshness and unchanged production immediately before activation
        run: node scripts/d1/prepare-approved-production-activation.mjs --recheck
      - name: Deploy reviewed bundle with all five data flags set to d1
        id: deploy
        run: npx opennextjs-cloudflare deploy
      - name: Verify activation and preservation of unrelated bindings
        id: verify
        run: node scripts/d1/prepare-approved-production-activation.mjs --verify-only
      - name: Check public pages and production configuration without writes
        id: pages
        env:
          PRODUCTION_EXPECTED_D1_MODE: d1
          PRODUCTION_PAGE_SMOKE: 'true'
        run: node scripts/d1/production-config-audit.mjs
      - name: Retain recovery identifiers without credential values
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-activation-recovery
          path: production-activation-recovery.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Publish sanitized activation result
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          PAGES_OUTCOME: ${{ steps.pages.outcome }}
        run: |
          node --input-type=module <<'NODE'
          const {GITHUB_REPOSITORY: repo, GITHUB_SHA: sha, GITHUB_RUN_ID: run, GH_TOKEN: token} = process.env;
          const state = ['DEPLOY_OUTCOME','VERIFY_OUTCOME','PAGES_OUTCOME'].every(name => process.env[name] === 'success') ? 'success' : 'failure';
          const response = await fetch(`https://api.github.com/repos/${repo}/statuses/${sha}`, {
            method: 'POST', headers: {Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json'},
            body: JSON.stringify({state, context: 'D1 approved production activation', description: state === 'success' ? 'D1 data activation verified; password login retained' : 'Inspect activation job; do not blindly revert after writes', target_url: `https://github.com/${repo}/actions/runs/${run}`}),
          });
          if (!response.ok) throw new Error(`Status publication HTTP ${response.status}`);
          NODE
