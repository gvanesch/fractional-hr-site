name: Hosted QA Health Check proof

on:
  push:
    branches:
      - chore/supabase-retirement-2026-11
      - migration/d1
    paths:
      - scripts/security/qa-healthcheck-smoke-request.json

permissions:
  contents: read

concurrency:
  group: hosted-qa-healthcheck-proof
  cancel-in-progress: false

jobs:
  prove:
    name: Verify one synthetic Health Check in QA D1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify smoke-test boundaries without network
        run: node --test tests/d1/qa-healthcheck-smoke.test.mjs
      - name: Submit or reuse the requested QA proof
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '73221f18acc676e4992c89fcbf2b2a8f'
        run: node scripts/security/qa-healthcheck-smoke.mjs
