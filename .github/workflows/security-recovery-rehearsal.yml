name: Isolated synthetic D1 recovery rehearsal
on:
  push:
    branches: [security/recovery-rehearsal-2026-10-23]
    paths: [.github/workflows/security-recovery-rehearsal.yml, scripts/security/recovery-rehearsal.mjs]
permissions:
  contents: read
concurrency:
  group: isolated-security-recovery-rehearsal
  cancel-in-progress: false
jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: "73221f18acc676e4992c89fcbf2b2a8f"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify synthetic database restore and undo without production writes
        run: node scripts/security/recovery-rehearsal.mjs
