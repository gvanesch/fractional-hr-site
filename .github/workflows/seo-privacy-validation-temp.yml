name: SEO and Privacy Validation Temp

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/seo-privacy-validation-temp.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_ENV: production
      NEXT_PUBLIC_SUPABASE_URL: https://qxddddhhpfrrxbaunwfw.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_validation_placeholder
      NEXT_PUBLIC_SITE_URL: https://www.vanesch.uk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --omit=dev

      - name: Build application
        run: npm run build
