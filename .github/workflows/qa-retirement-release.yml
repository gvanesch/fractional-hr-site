name: Supabase retirement candidate QA release

on:
  push:
    branches:
      - chore/supabase-retirement-2026-11
    paths:
      - scripts/security/qa-retirement-release-request.json

permissions:
  contents: read

concurrency:
  group: d1-qa-worker-deployment
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'gvanesch/fractional-hr-site' && github.ref == 'refs/heads/chore/supabase-retirement-2026-11'
    name: Release reviewed code to existing QA only
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
      NEXT_PUBLIC_APP_ENV: qa
      NEXT_PUBLIC_SITE_URL: https://fractional-hr-site-qa.greg-732.workers.dev
      ADVISOR_AUTH_MODE: cloudflare_access
      D1_SYSTEM_EVENTS_MODE: d1
      D1_DIAGNOSTIC_SUBMISSIONS_MODE: d1
      D1_CRM_PROSPECTS_MODE: d1
      D1_CLIENT_DIAGNOSTIC_MODE: d1
      D1_CLIENT_DIAGNOSTIC_SECURITY_MODE: d1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify application and release guards without Supabase credentials
        run: npm run test:d1
      - name: Verify exact QA request and existing production state with GET only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '73221f18acc676e4992c89fcbf2b2a8f'
        run: node scripts/security/qa-retirement-release.mjs prepare
      - name: Build the isolated QA Worker without Cloudflare token or Supabase credentials
        run: npx opennextjs-cloudflare build --config wrangler.qa-retirement.generated.json --env qa
      - name: Upload QA version, recheck leases, activate QA and verify with read-only requests
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '73221f18acc676e4992c89fcbf2b2a8f'
        run: node scripts/security/qa-retirement-release.mjs deploy
      - name: Retain sanitized release and recovery identifiers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-retirement-release-evidence
          path: qa-retirement-release-report.json
          if-no-files-found: ignore
          retention-days: 14
