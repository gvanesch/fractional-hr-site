name: D1 hosted QA preflight

on:
  workflow_dispatch:
  push:
    branches:
      - migration/d1
    paths:
      - scripts/d1/qa-hosted-preflight.mjs
      - .github/workflows/d1-qa-hosted-preflight.yml
      - wrangler.jsonc

permissions:
  contents: read
  statuses: write

jobs:
  inspect-qa-worker:
    name: Inspect deployed QA binding names and modes
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: '73221f18acc676e4992c89fcbf2b2a8f'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Inspect QA Worker without exposing secret values
        id: preflight
        run: node scripts/d1/qa-hosted-preflight.mjs
      - name: Publish sanitized QA preflight result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
        run: |
          node --input-type=module <<'NODE'
          const { GITHUB_REPOSITORY: repo, GITHUB_SHA: sha, GITHUB_RUN_ID: run, GH_TOKEN: token } = process.env;
          const state = process.env.PREFLIGHT_OUTCOME === "success" ? "success" : "failure";
          const response = await fetch(`https://api.github.com/repos/${repo}/statuses/${sha}`, {
            method: "POST",
            headers: {
              Authorization: `Bearer ${token}`,
              Accept: "application/vnd.github+json",
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              state,
              context: "D1 hosted QA preflight",
              description: state === "success" ? "All QA bindings ready" : "Inspect missing binding names in preflight job",
              target_url: `https://github.com/${repo}/actions/runs/${run}`,
            }),
          });
          if (!response.ok) throw new Error(`GitHub status publication failed: HTTP ${response.status}`);
          NODE
