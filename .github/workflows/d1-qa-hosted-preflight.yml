name: D1 hosted QA preflight

on:
  workflow_dispatch:
  push:
    branches:
      - migration/d1
    paths:
      - scripts/d1/qa-hosted-preflight.mjs
      - .github/workflows/d1-qa-hosted-preflight.yml
      - wrangler.jsonc

permissions:
  contents: read

jobs:
  inspect-qa-worker:
    name: Inspect deployed QA binding names and modes
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: '73221f18acc676e4992c89fcbf2b2a8f'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Inspect QA Worker without exposing secret values
        run: node scripts/d1/qa-hosted-preflight.mjs
