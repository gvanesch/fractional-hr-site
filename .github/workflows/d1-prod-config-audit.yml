name: D1 production configuration audit

on:
  push:
    branches:
      - migration/d1
    paths:
      - scripts/d1/production-config-audit.mjs
      - .github/workflows/d1-prod-config-audit.yml

permissions:
  contents: read
  statuses: write

jobs:
  inspect:
    name: Inspect production configuration without writes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DAILY_SUMMARY_ENDPOINT_SECRET: ${{ secrets.DAILY_SUMMARY_ENDPOINT_SECRET }}
      CLOUDFLARE_ACCOUNT_ID: "73221f18acc676e4992c89fcbf2b2a8f"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: inspect
        run: node scripts/d1/production-config-audit.mjs
      - name: Publish sanitized result and run link
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PREFLIGHT_OUTCOME: ${{ steps.inspect.outcome }}
        run: |
          node --input-type=module <<'NODE'
          const { GITHUB_REPOSITORY: repo, GITHUB_SHA: sha, GITHUB_RUN_ID: run, GH_TOKEN: token } = process.env;
          const state = process.env.PREFLIGHT_OUTCOME === "success" ? "success" : "failure";
          const response = await fetch(`https://api.github.com/repos/${repo}/statuses/${sha}`, {
            method: "POST",
            headers: {
              Authorization: `Bearer ${token}`,
              Accept: "application/vnd.github+json",
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              state,
              context: "D1 production configuration audit",
              description: state === "success" ? "Production configuration inspected without writes" : "Inspect production configuration audit job",
              target_url: `https://github.com/${repo}/actions/runs/${run}`,
            }),
          });
          if (!response.ok) throw new Error(`GitHub status publication failed: HTTP ${response.status}`);
          NODE
