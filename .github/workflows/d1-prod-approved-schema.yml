name: D1 explicitly approved production schema only

on:
  push:
    branches:
      - migration/d1
    paths:
      - scripts/d1/production-schema-approval.json

permissions:
  contents: read
  statuses: write

concurrency:
  group: vanesch-prod-approved-schema
  cancel-in-progress: false

jobs:
  schema:
    name: Apply only explicitly approved production migrations 0004 and 0005
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: '73221f18acc676e4992c89fcbf2b2a8f'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:d1
      - name: Guard approval, reconcile, record recovery point and apply only reviewed SQL
        id: schema
        run: node scripts/d1/apply-approved-production-schema.mjs
      - name: Publish sanitized schema result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEMA_OUTCOME: ${{ steps.schema.outcome }}
        run: |
          node --input-type=module <<'NODE'
          const {GITHUB_REPOSITORY: repo, GITHUB_SHA: sha, GITHUB_RUN_ID: run, GH_TOKEN: token} = process.env;
          const state = process.env.SCHEMA_OUTCOME === 'success' ? 'success' : 'failure';
          const response = await fetch(`https://api.github.com/repos/${repo}/statuses/${sha}`, {
            method: 'POST',
            headers: {Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json'},
            body: JSON.stringify({state, context: 'D1 approved production schema', description: state === 'success' ? 'Only approved schema applied; no cutover' : 'Inspect schema job before proceeding', target_url: `https://github.com/${repo}/actions/runs/${run}`}),
          });
          if (!response.ok) throw new Error(`Status publication HTTP ${response.status}`);
          NODE
