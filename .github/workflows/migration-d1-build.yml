name: Migration branch build

on:
  push:
    branches:
      - migration/d1
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: migration-d1-build
  cancel-in-progress: true

jobs:
  build:
    name: Next.js build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NEXT_PUBLIC_APP_ENV: local
      NEXT_PUBLIC_SUPABASE_URL: https://lrlapaiyejvbckqpbrwa.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      ADVISOR_ALLOWED_EMAILS: advisor@example.com
      RESEND_API_KEY: re_ci_placeholder
      CONTACT_FROM_EMAIL: advisor@example.com
      CONTACT_TO_EMAIL: advisor@example.com
      CRON_SECRET: ci-placeholder-cron-secret
      DAILY_SUMMARY_RECIPIENT: advisor@example.com
      CLIENT_DIAGNOSTIC_OTP_SECRET: ci-placeholder-otp-secret

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Publish build result and run link
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_STATUS: ${{ job.status }}
        run: |
          node --input-type=module <<'NODE'
          const { GITHUB_REPOSITORY: repo, GITHUB_SHA: sha, GITHUB_RUN_ID: run, GH_TOKEN: token } = process.env;
          const state = process.env.BUILD_STATUS === "success" ? "success" : "failure";
          const response = await fetch(`https://api.github.com/repos/${repo}/statuses/${sha}`, {
            method: "POST",
            headers: {
              Authorization: `Bearer ${token}`,
              Accept: "application/vnd.github+json",
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              state,
              context: "Migration branch build",
              description: state === "success" ? "Next.js build passed" : "Inspect the build job",
              target_url: `https://github.com/${repo}/actions/runs/${run}`,
            }),
          });
          if (!response.ok) throw new Error(`GitHub status publication failed: HTTP ${response.status}`);
          NODE
