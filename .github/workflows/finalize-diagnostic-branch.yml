name: Finalize diagnostic branch

on:
  push:
    branches:
      - advisor-explorer-migrate-analytics
    paths:
      - scripts/finalize-diagnostic-branch.mjs
      - .github/workflows/finalize-diagnostic-branch.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_ENV: qa
      NEXT_PUBLIC_SUPABASE_URL: https://lrlapaiyejvbckqpbrwa.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder
      ADVISOR_ALLOWED_EMAILS: build@example.com
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      RESEND_API_KEY: re_build_only_placeholder
      CRON_SECRET: build-only-placeholder
      DAILY_SUMMARY_RECIPIENT: build@example.com
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: advisor-explorer-migrate-analytics
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply exact diagnostic finalization patches
        run: node scripts/finalize-diagnostic-branch.mjs

      - name: Check patch whitespace
        run: git diff --check

      - name: Run focused lint
        run: |
          npx eslint \
            lib/client-diagnostic/build-project-summary.ts \
            lib/client-diagnostic/get-project-summary.ts \
            lib/client-diagnostic/insight-engine.ts \
            lib/client-diagnostic/build-client-diagnostic-report.ts \
            app/api/advisor-daily-action-digest/route.ts \
            app/api/client-diagnostic-daily-summary/route.ts \
            app/api/advisor-submission/route.ts

      - name: Build
        run: npm run build

      - name: Commit validated changes
        run: |
          if git diff --quiet; then
            echo "No changes produced by finalization script."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/client-diagnostic/build-project-summary.ts \
            lib/client-diagnostic/get-project-summary.ts \
            lib/client-diagnostic/insight-engine.ts \
            lib/client-diagnostic/build-client-diagnostic-report.ts \
            app/api/advisor-daily-action-digest/route.ts
          git commit -m "Finalize diagnostic methodology and environment guards"
          git push origin HEAD:advisor-explorer-migrate-analytics
