name: Seed baseline QA admin demo
on:
  push:
    branches: [feature/team-blue-baseline]
    paths: [scripts/baseline/demo-seed.mjs, .github/workflows/baseline-demo-seed.yml]
permissions:
  contents: read
concurrency:
  group: d1-qa-worker-deployment
  cancel-in-progress: false
jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: "73221f18acc676e4992c89fcbf2b2a8f"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Guard QA database and email-preview target
        run: node scripts/baseline/prepare-qa.mjs
      - name: Verify QA administration schema
        run: npx wrangler d1 migrations apply DB --env qa --remote
      - name: Populate only reserved synthetic demo campaign
        run: node scripts/baseline/demo-seed.mjs
