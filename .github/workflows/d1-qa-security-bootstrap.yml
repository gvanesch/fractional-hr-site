name: D1 QA security bindings

on:
  push:
    branches:
      - migration/d1
    paths:
      - scripts/d1/configure-qa-security.mjs
      - .github/workflows/d1-qa-security-bootstrap.yml

permissions:
  contents: read
  statuses: write

jobs:
  configure:
    name: Configure QA-only OTP and invite secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "73221f18acc676e4992c89fcbf2b2a8f"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: configure
        run: node scripts/d1/configure-qa-security.mjs
      - name: Publish sanitized result and run link
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIGURE_OUTCOME: ${{ steps.configure.outcome }}
        run: |
          node --input-type=module <<'NODE'
          const { GITHUB_REPOSITORY: repo, GITHUB_SHA: sha, GITHUB_RUN_ID: run, GH_TOKEN: token } = process.env;
          const state = process.env.CONFIGURE_OUTCOME === "success" ? "success" : "failure";
          const response = await fetch(`https://api.github.com/repos/${repo}/statuses/${sha}`, {
            method: "POST",
            headers: {
              Authorization: `Bearer ${token}`,
              Accept: "application/vnd.github+json",
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              state,
              context: "D1 QA security bindings",
              description: state === "success" ? "QA OTP and invite bindings configured" : "Inspect the QA security job",
              target_url: `https://github.com/${repo}/actions/runs/${run}`,
            }),
          });
          if (!response.ok) throw new Error(`GitHub status publication failed: HTTP ${response.status}`);
          NODE
