name: D1 approved production mail configuration

on:
  push:
    branches:
      - migration/d1
    paths:
      - scripts/d1/production-mail-approval.json

permissions:
  contents: read
  statuses: write

concurrency:
  group: vanesch-production-release
  cancel-in-progress: false

jobs:
  mail:
    name: Configure only the three approved production mail settings
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: '73221f18acc676e4992c89fcbf2b2a8f'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tests/d1/production-mail-approval.test.mjs
      - name: Guard approval, configure exact mail fields and verify preserved bindings
        id: mail
        run: node scripts/d1/configure-approved-production-mail.mjs
      - name: Publish sanitized mail configuration result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          MAIL_OUTCOME: ${{ steps.mail.outcome }}
        run: |
          node --input-type=module <<'NODE'
          const {GITHUB_REPOSITORY: repo, GITHUB_SHA: sha, GITHUB_RUN_ID: run, GH_TOKEN: token} = process.env;
          const state = process.env.MAIL_OUTCOME === 'success' ? 'success' : 'failure';
          const response = await fetch(`https://api.github.com/repos/${repo}/statuses/${sha}`, {
            method: 'POST',
            headers: {Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json'},
            body: JSON.stringify({state, context: 'D1 approved production mail', description: state === 'success' ? 'Approved mail settings configured; D1 remains off' : 'Inspect production mail job before proceeding', target_url: `https://github.com/${repo}/actions/runs/${run}`}),
          });
          if (!response.ok) throw new Error(`Status publication HTTP ${response.status}`);
          NODE
