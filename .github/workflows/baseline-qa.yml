name: Baseline QA build and deployment
on:
  push:
    branches: [feature/team-blue-baseline]
permissions:
  contents: read
concurrency:
  group: d1-qa-worker-deployment
  cancel-in-progress: false
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: "73221f18acc676e4992c89fcbf2b2a8f"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test database, branching, autosave and invitation security
        run: npm run test:d1
      - name: Check types and baseline lint
        run: |
          npx tsc --noEmit
          npx eslint lib/baseline app/baseline app/advisor/baseline app/api/baseline app/components/CookieBanner.tsx next.config.ts
      - name: Guard the QA-only target
        run: node scripts/baseline/prepare-qa.mjs
      - name: Install isolated browser test tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/baseline-browser" --no-package-lock playwright@1.62.1
          "$RUNNER_TEMP/baseline-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "BASELINE_PLAYWRIGHT_PATH=$RUNNER_TEMP/baseline-browser/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Test desktop and mobile assessment journey
        run: node scripts/baseline/ui-check.cjs
      - name: Test broad-work prototype on desktop and mobile
        run: node scripts/baseline/prototype-check.cjs
      - name: Test advisor-only technology preview on desktop and mobile
        run: node scripts/baseline/technology-check.cjs
      - name: Test advisor-only manager preview on desktop and mobile
        run: node scripts/baseline/management-check.cjs
      - name: Test baseline administration on desktop and mobile
        run: node scripts/baseline/admin-check.cjs
      - name: Test reviewed collection save, resume and submission on desktop and mobile
        run: node scripts/baseline/collection-check.cjs
      - name: Apply dedicated baseline schema to QA only
        run: npx wrangler d1 migrations apply DB --env qa --remote
      - name: Build QA Worker
        run: npx opennextjs-cloudflare build --env qa
      - name: Deploy QA only
        run: npx opennextjs-cloudflare deploy --env qa
      - name: Verify deployed QA configuration
        run: node scripts/d1/qa-hosted-preflight.mjs --deployment
      - name: Verify anonymous baseline boundary
        run: node scripts/baseline/hosted-check.mjs
      - name: Verify real hosted participant and QA D1 contract
        run: node scripts/baseline/hosted-participant.mjs

      - name: Verify reviewed hosted collection and QA D1 contract
        run: node scripts/baseline/hosted-reviewed.mjs
      - name: Verify existing QA email credential or provision the isolated test binding
        env:
          BASELINE_QA_RESEND_TOKEN: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -n "$BASELINE_QA_RESEND_TOKEN" ]; then
            printf '%s' "$BASELINE_QA_RESEND_TOKEN" | npx wrangler secret put BASELINE_QA_RESEND_API_KEY --env qa
          else
            node --input-type=module <<'NODE'
            const account=process.env.CLOUDFLARE_ACCOUNT_ID;
            if(account!=="73221f18acc676e4992c89fcbf2b2a8f")throw Error("QA account mismatch");
            const r=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/fractional-hr-site-qa/secrets`,{headers:{Authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`}});
            if(!r.ok)throw Error(`QA secret-name inventory unavailable: HTTP ${r.status}`);
            const b=await r.json();if(!b.success||!Array.isArray(b.result)||!b.result.some(s=>["BASELINE_QA_RESEND_API_KEY","RESEND_API_KEY"].includes(s.name)))throw Error("No configured QA email credential is available.");
            console.log("Existing QA Worker email credential is available. Values were not read or copied; restricted Greg-only sending remains enforced.");
            NODE
          fi
      - name: Send authorised Greg-only invitation and verification-code previews once
        env:
          BASELINE_QA_RESEND_TOKEN: ${{ secrets.RESEND_API_KEY }}
        run: node scripts/baseline/greg-mail-smoke.mjs
