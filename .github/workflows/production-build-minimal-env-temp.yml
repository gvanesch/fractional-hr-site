name: Temporary production build minimal env validation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/production-build-minimal-env-temp.yml

permissions:
  contents: read

jobs:
  validate-production-build-env:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_ENV: production
      NEXT_PUBLIC_SUPABASE_URL: https://qxddddhhpfrrxbaunwfw.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-public-placeholder
      NEXT_PUBLIC_SITE_URL: https://www.vanesch.uk
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build OpenNext Cloudflare worker
        run: npx opennextjs-cloudflare build

      - name: Validate Wrangler bundle
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
