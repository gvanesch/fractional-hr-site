name: Controlled production IT invitation and OTP test
on:
  push:
    branches: [migration/d1]
    paths: [scripts/baseline/production-it-test-approval.json]
permissions:
  contents: read
  actions: read
concurrency:
  group: vanesch-production-release
  cancel-in-progress: false
jobs:
  test-invite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: "73221f18acc676e4992c89fcbf2b2a8f"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      BASELINE_RELEASE_KIND: it-test
      NEXT_PUBLIC_APP_ENV: production
      NEXT_PUBLIC_SUPABASE_URL: https://qxddddhhpfrrxbaunwfw.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SITE_URL: https://vanesch.uk
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npm run test:d1
      - run: npx tsc --noEmit
      - name: Verify approved recipient, exact QA revision and production settings
        run: node scripts/baseline/depth-release.mjs prepare
      - name: Build the restricted IT test
        run: npx opennextjs-cloudflare build
      - name: Deploy without changing production configuration
        run: npx opennextjs-cloudflare deploy
      - name: Verify production settings and authentication boundaries
        run: node scripts/baseline/depth-release.mjs verify
      - name: Send Toni one invitation; OTP waits for his request
        run: node scripts/baseline/production-it-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baseline-production-it-test
          path: |
            baseline-depth-recovery.json
            baseline-it-test-verification.json
          if-no-files-found: ignore
          retention-days: 30
