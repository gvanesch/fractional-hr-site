name: D1 explicitly approved flags-off production release

on:
  push:
    branches:
      - migration/d1
    paths:
      - scripts/d1/production-release-approval.json

permissions:
  contents: read
  statuses: write

concurrency:
  group: vanesch-production-release
  cancel-in-progress: false

jobs:
  release:
    name: Deploy only an explicitly approved flags-off production release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: '73221f18acc676e4992c89fcbf2b2a8f'
      RELEASE_PREVIOUS_SHA: ${{ github.event.before }}
      NEXT_PUBLIC_APP_ENV: production
      NEXT_PUBLIC_SUPABASE_URL: https://qxddddhhpfrrxbaunwfw.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SITE_URL: https://vanesch.uk
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:d1
      - name: Verify exact approval and production prerequisites without writes
        run: node scripts/d1/prepare-approved-production-release.mjs
      - name: Build the approved production OpenNext bundle
        run: npx opennextjs-cloudflare build
      - name: Recheck production settings immediately before deployment
        run: node scripts/d1/prepare-approved-production-release.mjs
      - name: Deploy approved production code with every D1 flag off
        id: deploy
        run: npx opennextjs-cloudflare deploy
      - name: Verify deployed production bindings and disabled D1 flags
        id: verify
        run: node scripts/d1/prepare-approved-production-release.mjs --verify-only
      - name: Retain sanitized previous deployment identifiers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-release-recovery
          path: production-release-recovery.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Publish sanitized release result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          node --input-type=module <<'NODE'
          const {GITHUB_REPOSITORY: repo, GITHUB_SHA: sha, GITHUB_RUN_ID: run, GH_TOKEN: token} = process.env;
          const state = process.env.DEPLOY_OUTCOME === 'success' && process.env.VERIFY_OUTCOME === 'success' ? 'success' : 'failure';
          const response = await fetch(`https://api.github.com/repos/${repo}/statuses/${sha}`, {
            method: 'POST', headers: {Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json'},
            body: JSON.stringify({state, context: 'D1 approved flags-off production release', description: state === 'success' ? 'Approved release verified; D1 remains off' : 'Inspect release job before proceeding', target_url: `https://github.com/${repo}/actions/runs/${run}`}),
          });
          if (!response.ok) throw new Error(`Status publication HTTP ${response.status}`);
          NODE
