name: D1 QA Worker deployment

on:
  push:
    branches:
      - migration/d1
    paths:
      - .github/workflows/d1-qa-deploy.yml
      - 'app/advisor*/route.ts'
      - scripts/d1/prepare-qa-deploy.mjs

permissions:
  contents: read
  statuses: write

concurrency:
  group: d1-qa-worker-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy isolated QA Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "73221f18acc676e4992c89fcbf2b2a8f"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify D1 routes and security
        run: npm run test:d1
      - name: Resolve and validate the isolated QA target
        run: node scripts/d1/prepare-qa-deploy.mjs
      - name: Build OpenNext for QA
        run: npx opennextjs-cloudflare build --env qa
      - name: Deploy QA only
        id: qa_deploy
        run: npx opennextjs-cloudflare deploy --env qa
      - name: Inspect deployed QA bindings
        id: qa_preflight
        run: node scripts/d1/qa-hosted-preflight.mjs --deployment
      - name: Publish sanitized QA deployment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_OUTCOME: ${{ steps.qa_deploy.outcome }}
          PREFLIGHT_OUTCOME: ${{ steps.qa_preflight.outcome }}
        run: |
          node --input-type=module <<'NODE'
          const { GITHUB_REPOSITORY: repo, GITHUB_SHA: sha, GITHUB_RUN_ID: run, GH_TOKEN: token } = process.env;
          const state = process.env.DEPLOY_OUTCOME === "success" && process.env.PREFLIGHT_OUTCOME === "success" ? "success" : "failure";
          const response = await fetch(`https://api.github.com/repos/${repo}/statuses/${sha}`, {
            method: "POST",
            headers: {
              Authorization: `Bearer ${token}`,
              Accept: "application/vnd.github+json",
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              state,
              context: "D1 QA Worker deployment",
              description: state === "success" ? "QA deployment and binding check passed" : "Inspect the QA deployment job",
              target_url: `https://github.com/${repo}/actions/runs/${run}`,
            }),
          });
          if (!response.ok) throw new Error(`GitHub status publication failed: HTTP ${response.status}`);
          NODE
