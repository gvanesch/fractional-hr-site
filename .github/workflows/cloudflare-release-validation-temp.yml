name: Temporary Cloudflare release validation

on:
  push:
    branches:
      - advisor-explorer-migrate-analytics
    paths:
      - .github/workflows/cloudflare-release-validation-temp.yml

permissions:
  contents: read

jobs:
  validate-cloudflare-build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_ENV: qa
      NEXT_PUBLIC_SUPABASE_URL: https://lrlapaiyejvbckqpbrwa.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder
      ADVISOR_ALLOWED_EMAILS: build@example.com
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      RESEND_API_KEY: re_build_only_placeholder
      CRON_SECRET: build-only-placeholder
      DAILY_SUMMARY_RECIPIENT: build@example.com
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build OpenNext Cloudflare worker
        run: npx opennextjs-cloudflare build

      - name: Validate Wrangler bundle
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
