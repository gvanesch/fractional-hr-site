name: Baseline read-only production checkpoint
on:
  push:
    branches: [feature/team-blue-baseline]
    paths: [scripts/baseline/readiness-production-audit.mjs, .github/workflows/baseline-readiness-audit.yml]
permissions:
  contents: read
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: "73221f18acc676e4992c89fcbf2b2a8f"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: node scripts/baseline/readiness-production-audit.mjs
