name: Temporary dependency security fix

on:
  push:
    branches:
      - advisor-explorer-migrate-analytics
    paths:
      - .github/workflows/security-fix-temp.yml

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_ENV: qa
      NEXT_PUBLIC_SUPABASE_URL: https://lrlapaiyejvbckqpbrwa.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder
      ADVISOR_ALLOWED_EMAILS: build@example.com
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      RESEND_API_KEY: re_build_only_placeholder
      CRON_SECRET: build-only-placeholder
      DAILY_SUMMARY_RECIPIENT: build@example.com
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: advisor-explorer-migrate-analytics
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply non-breaking audit fixes
        run: npm audit fix

      - name: Confirm only dependency manifests changed
        run: |
          unexpected="$(git diff --name-only | grep -vE '^(package.json|package-lock.json)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected files changed:"
            echo "$unexpected"
            exit 1
          fi
          git diff --check
          git diff -- package.json package-lock.json

      - name: Require clean runtime audit
        run: npm audit --omit=dev --audit-level=moderate

      - name: Require clean full audit
        run: npm audit --audit-level=moderate

      - name: Focused lint
        run: |
          npx eslint \
            lib/client-diagnostic/build-project-summary.ts \
            lib/client-diagnostic/get-project-summary.ts \
            lib/client-diagnostic/insight-engine.ts \
            lib/client-diagnostic/build-client-diagnostic-report.ts \
            lib/client-diagnostic/build-explorer-cohort.ts \
            app/api/advisor-daily-action-digest/route.ts \
            app/api/client-diagnostic-daily-summary/route.ts \
            app/api/advisor-submission/route.ts \
            'app/(public)/diagnostic-assessment/page.tsx'

      - name: Production build
        run: npm run build

      - name: Commit validated dependency fixes
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Update dependencies for security fixes"
          git push origin HEAD:advisor-explorer-migrate-analytics
