name: D1 production activation readiness

on:
  push:
    branches: [migration/d1]
    paths:
      - scripts/d1/prepare-approved-production-activation.mjs
      - scripts/d1/production-client-source-manifest.json
      - tests/d1/production-activation.test.mjs
      - .github/workflows/d1-prod-activation-readiness.yml
      - .github/workflows/d1-prod-approved-activation.yml

permissions:
  contents: read
  statuses: write

jobs:
  prepare:
    name: Inspect production and build an activation artifact without deployment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: '73221f18acc676e4992c89fcbf2b2a8f'
      NEXT_PUBLIC_APP_ENV: production
      NEXT_PUBLIC_SUPABASE_URL: https://qxddddhhpfrrxbaunwfw.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SITE_URL: https://vanesch.uk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:d1
      - name: Inspect activation prerequisites with GET and SELECT requests only
        id: inspect
        run: node scripts/d1/prepare-approved-production-activation.mjs --check-only
      - name: Build production bundle without deploying it
        run: npx opennextjs-cloudflare build
      - name: Retain immutable production build for separate explicit approval
        id: bundle
        uses: actions/upload-artifact@v4
        with:
          name: approved-d1-production-bundle
          path: .open-next
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Publish sanitized readiness result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_OUTCOME: ${{ steps.bundle.outcome }}
          INSPECT_OUTCOME: ${{ steps.inspect.outcome }}
        run: |
          node --input-type=module <<'NODE'
          const {GITHUB_REPOSITORY: repo, GITHUB_SHA: sha, GITHUB_RUN_ID: run, GH_TOKEN: token} = process.env;
          const state = process.env.INSPECT_OUTCOME === 'success' && process.env.BUNDLE_OUTCOME === 'success' ? 'success' : 'failure';
          const response = await fetch(`https://api.github.com/repos/${repo}/statuses/${sha}`, {
            method: 'POST', headers: {Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json'},
            body: JSON.stringify({state, context: 'D1 production activation readiness', description: state === 'success' ? 'Read-only inspection and production bundle passed' : 'Inspect activation readiness job', target_url: `https://github.com/${repo}/actions/runs/${run}`}),
          });
          if (!response.ok) throw new Error(`Status publication HTTP ${response.status}`);
          NODE
